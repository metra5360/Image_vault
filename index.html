<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Vault — сховище скріншотів</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@380;500;650;750&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0d12;
      --bg-2: #12151c;
      --panel: rgba(22, 26, 36, 0.72);
      --line: rgba(255, 255, 255, 0.08);
      --text: #f4f6fb;
      --muted: #9aa3b5;
      --accent: #7c6cff;
      --accent-2: #3ee0c2;
      --danger: #ff6b81;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      --radius: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(124, 108, 255, 0.22), transparent 50%),
        radial-gradient(900px 500px at 100% 0%, rgba(62, 224, 194, 0.12), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: Outfit, system-ui, sans-serif;
    }

    body { padding: 28px 22px 80px; }

    .app {
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: linear-gradient(145deg, var(--accent), #4f8cff 55%, var(--accent-2));
      box-shadow: 0 12px 30px rgba(124, 108, 255, 0.35);
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 750;
      letter-spacing: -0.03em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 2px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type="search"] {
      width: min(280px, 70vw);
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 999px;
      padding: 11px 16px;
      outline: none;
      backdrop-filter: blur(16px);
    }

    input[type="search"]:focus {
      border-color: rgba(124, 108, 255, 0.7);
    }

    button, .btn {
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 650;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(16px);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    button:hover, .btn:hover { transform: translateY(-1px); }

    .primary {
      background: linear-gradient(135deg, var(--accent), #4f8cff);
      border-color: transparent;
    }

    .danger { color: var(--danger); }

    .dropzone {
      border: 1.5px dashed rgba(255, 255, 255, 0.16);
      border-radius: var(--radius);
      padding: 28px;
      text-align: center;
      background: var(--panel);
      margin-bottom: 26px;
      transition: border-color 0.2s, background 0.2s;
    }

    .dropzone.drag {
      border-color: var(--accent);
      background: rgba(124, 108, 255, 0.12);
    }

    .dropzone p { color: var(--muted); margin-top: 6px; }
    .kbd {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      font-size: 0.85rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .thumb-wrap {
      position: relative;
      aspect-ratio: 4 / 3;
      background: #0a0c11;
      overflow: hidden;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-actions {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .card:hover .card-actions { opacity: 1; }

    .icon-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(10, 12, 18, 0.72);
    }

    .caption {
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .caption textarea {
      width: 100%;
      resize: none;
      min-height: 54px;
      background: transparent;
      border: 0;
      color: var(--text);
      font: inherit;
      outline: none;
    }

    .meta {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 48px 12px;
    }

    dialog {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: #12151c;
      color: var(--text);
      padding: 0;
      max-width: min(960px, 94vw);
      width: 960px;
    }

    dialog::backdrop { background: rgba(5, 7, 12, 0.72); }

    .lightbox img {
      width: 100%;
      max-height: 72vh;
      object-fit: contain;
      background: #07080c;
      display: block;
    }

    .lightbox-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      align-items: center;
    }

    input[type="file"] { display: none; }

    @media (max-width: 640px) {
      .card-actions { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h1>Image Vault</h1>
          <p class="subtitle">Зберігайте скріншоти та фото з підписами — усе лишається в браузері</p>
        </div>
      </div>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Пошук за підписом…" />
        <button class="primary" id="addBtn" type="button">Додати зображення</button>
        <button id="pasteBtn" type="button">Вставити скрін</button>
        <button class="danger" id="clearBtn" type="button">Очистити все</button>
        <input id="fileInput" type="file" accept="image/*" multiple />
      </div>
    </header>

    <section class="dropzone" id="dropzone">
      <strong>Перетягніть файли сюди</strong>
      <p>або натисніть <span class="kbd">Ctrl</span> + <span class="kbd">V</span>, щоб вставити скріншот з буфера</p>
    </section>

    <section class="grid" id="grid"></section>
  </div>

  <dialog id="lightbox">
    <div class="lightbox">
      <img id="lightboxImg" alt="" />
      <div class="lightbox-bar">
        <p id="lightboxCaption"></p>
        <button type="button" id="closeLightbox">Закрити</button>
      </div>
    </div>
  </dialog>

  <script>
    const DB_NAME = "image-vault";
    const STORE = "items";

    const grid = document.getElementById("grid");
    const search = document.getElementById("search");
    const fileInput = document.getElementById("fileInput");
    const dropzone = document.getElementById("dropzone");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxCaption = document.getElementById("lightboxCaption");

    let items = [];

    function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          req.result.createObjectStore(STORE, { keyPath: "id" });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function loadItems() {
      const db = await openDb();
      items = await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, "readonly");
        const req = tx.objectStore(STORE).getAll();
        req.onsuccess = () => resolve(req.result.sort((a, b) => b.createdAt - a.createdAt));
        req.onerror = () => reject(req.error);
      });
      render();
    }

    async function saveItem(item) {
      const db = await openDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).put(item);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    async function deleteItem(id) {
      const db = await openDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      items = items.filter((item) => item.id !== id);
      render();
    }

    async function clearAll() {
      if (!confirm("Видалити всі зображення?")) return;
      const db = await openDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).clear();
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      items = [];
      render();
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function addFiles(files) {
      const list = [...files].filter((file) => file.type.startsWith("image/"));
      for (const file of list) {
        const dataUrl = await blobToDataUrl(file);
        const item = {
          id: crypto.randomUUID(),
          caption: file.name.replace(/\.[^.]+$/, ""),
          createdAt: Date.now(),
          type: file.type,
          dataUrl
        };
        items.unshift(item);
        await saveItem(item);
      }
      render();
    }

    function formatDate(ts) {
      return new Intl.DateTimeFormat("uk-UA", {
        dateStyle: "medium",
        timeStyle: "short"
      }).format(ts);
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      const visible = items.filter((item) => (item.caption || "").toLowerCase().includes(query));
      grid.innerHTML = "";

      if (!visible.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = items.length
          ? "Нічого не знайдено за цим підписом."
          : "Поки порожньо. Додайте скріншот або фото.";
        grid.append(empty);
        return;
      }

      for (const item of visible) {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="thumb-wrap">
            <img alt="" />
            <div class="card-actions">
              <button class="icon-btn" data-act="download" title="Завантажити">↓</button>
              <button class="icon-btn danger" data-act="delete" title="Видалити">✕</button>
            </div>
          </div>
          <div class="caption">
            <textarea rows="2" maxlength="240"></textarea>
            <p class="meta"></p>
          </div>
        `;
        const img = card.querySelector("img");
        img.src = item.dataUrl;
        img.alt = item.caption || "Зображення";
        img.addEventListener("click", () => {
          lightboxImg.src = item.dataUrl;
          lightboxImg.alt = item.caption;
          lightboxCaption.textContent = item.caption || "Без підпису";
          lightbox.showModal();
        });

        const textarea = card.querySelector("textarea");
        textarea.value = item.caption;
        textarea.placeholder = "Підпис під зображенням…";
        textarea.addEventListener("change", async () => {
          item.caption = textarea.value.trim();
          await saveItem(item);
          img.alt = item.caption || "Зображення";
        });

        card.querySelector(".meta").textContent = formatDate(item.createdAt);

        card.querySelector('[data-act="delete"]').addEventListener("click", (e) => {
          e.stopPropagation();
          if (confirm("Видалити це зображення?")) deleteItem(item.id);
        });

        card.querySelector('[data-act="download"]').addEventListener("click", (e) => {
          e.stopPropagation();
          const a = document.createElement("a");
          a.href = item.dataUrl;
          a.download = (item.caption || "image").replace(/[\\/:*?"<>|]/g, "_") + ".png";
          a.click();
        });

        grid.append(card);
      }
    }

    document.getElementById("addBtn").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      addFiles(fileInput.files);
      fileInput.value = "";
    });

    dropzone.addEventListener("click", () => fileInput.click());
    ["dragenter", "dragover"].forEach((eventName) => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.add("drag");
      });
    });
    ["dragleave", "drop"].forEach((eventName) => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.remove("drag");
      });
    });
    dropzone.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));

    document.getElementById("pasteBtn").addEventListener("click", async () => {
      try {
        const itemsFromClipboard = await navigator.clipboard.read();
        const files = [];
        for (const clip of itemsFromClipboard) {
          const type = clip.types.find((t) => t.startsWith("image/"));
          if (type) files.push(await clip.getType(type));
        }
        if (files.length) await addFiles(files);
        else alert("У буфері немає зображення. Зробіть скрін і натисніть Ctrl+V.");
      } catch {
        alert("Дозвольте доступ до буфера або просто натисніть Ctrl+V.");
      }
    });

    window.addEventListener("paste", (e) => {
      const files = [...(e.clipboardData?.items || [])]
        .filter((item) => item.type.startsWith("image/"))
        .map((item) => item.getAsFile())
        .filter(Boolean);
      if (files.length) addFiles(files);
    });

    search.addEventListener("input", render);
    document.getElementById("clearBtn").addEventListener("click", clearAll);
    document.getElementById("closeLightbox").addEventListener("click", () => lightbox.close());
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) lightbox.close();
    });

    loadItems();
  </script>
</body>
</html>
